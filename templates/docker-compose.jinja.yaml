services:
  db:
    image: {{ postgres_image }}
    restart: always
    environment:
      POSTGRES_USER: {{ db_user }}
      POSTGRES_PASSWORD: {{ db_pass }}
      POSTGRES_DB: {{ db_name }}
    volumes:
      - pgdata:{{ pgdata_path }}

{% for m in active_models %}
  vllm-{{ m.id }}:
    image: {{ m.image }}
    restart: always
    environment:
      - CUDA_VISIBLE_DEVICES={{ m.gpu_id }}
    volumes:
      - {{ hf_home_path }}:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['{{ m.gpu_id }}']
              capabilities: [gpu]
    command: >
      --model {{ m.hf_repo }}
      --port {{ m.port }}
      --gpu-memory-utilization 0.85
      --max-model-len {{ m.max_model_len }}

{% endfor %}
  litellm:
    image: {{ litellm_image }}
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    env_file:
      - .env
    command: --config /app/config.yaml --port 4000
    depends_on:
      - db
{% for m in active_models %}
      - vllm-{{ m.id }}
{% endfor %}

litellm:
    image: {{ litellm_image }}
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL={{ db_url }}
      - LITELLM_MASTER_KEY={{ litellm_master_key }}
      - UI_USERNAME={{ ui_username }}
      - UI_PASSWORD={{ ui_password }}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    env_file:
      - .env
    command: --config /app/config.yaml --port 4000
    depends_on:
      - db

volumes:
  pgdata: