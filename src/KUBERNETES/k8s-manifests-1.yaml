---
# 1. PostgreSQL Persistence Deployment
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: default
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_PASSWORD
          value: "${POSTGRES_PASSWORD}"
        - name: POSTGRES_DB
          value: "litellm"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  ports:
  - port: 5432
  selector:
    app: postgres
---
# 2. Redis HA In-Memory Cache
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  ports:
  - port: 6379
  selector:
    app: redis
---
# 3. vLLM Model 1 Deployment (Dynamic GPU Binding)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-model-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-model-1
  template:
    metadata:
      labels:
        app: vllm-model-1
    spec:
      containers:
      - name: vllm-container
        image: vllm/vllm-openai:v0.6.0
        args: ["--model", "${MODEL_1_REPO}", "--port", "8000", "--trust-remote-code"]
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          value: "${HUGGINGFACE_TOKEN}"
        resources:
          limits:
            nvidia.com/gpu: 1
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-model-1-svc
spec:
  ports:
  - port: 8000
  selector:
    app: vllm-model-1
---
# 4. LiteLLM Proxy HA Gateway & Usage Tracking
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-v1.45.0
        args: ["--config", "/app/config.yaml", "--port", "4000"]
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres-service:5432/litellm"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          value: "${REDIS_PASSWORD}"
        - name: LITELLM_MASTER_KEY
          value: "${LITELLM_MASTER_KEY}"
        volumeMounts:
        - name: config-volume
          mountPath: /app/config.yaml
          subPath: config.yaml
        ports:
        - containerPort: 4000
      volumes:
      - name: config-volume
        configMap:
          name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-service
spec:
  type: LoadBalancer
  ports:
  - port: 4000
    targetPort: 4000
  selector:
    app: litellm-proxy
