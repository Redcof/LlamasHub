---
# vLLM Engine Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-model-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-model-1
  template:
    metadata:
      labels:
        app: vllm-model-1
    spec:
      containers:
      - name: vllm-container
        image: vllm/vllm-openai:v0.6.0
        # RULE 1: Automated Tensor Parallelism enforcement (TP <= 2)
        args: 
        - "--model"
        - "${MODEL_1_REPO}"
        - "--port"
        - "8000"
        - "--tensor-parallel-size"
        - "${TENSOR_PARALLEL_SIZE}"
        - "--trust-remote-code"
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          value: "${HUGGINGFACE_TOKEN}"
        resources:
          limits:
            nvidia.com/gpu: "${TENSOR_PARALLEL_SIZE}"
        ports:
        - containerPort: 8000
        # RULE 3: vLLM Health & Readiness Probes
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 90
          periodSeconds: 15
---
# LiteLLM Proxy HA Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-v1.45.0
        args: ["--config", "/app/config.yaml", "--port", "4000"]
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres-service:5432/litellm"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          value: "${REDIS_PASSWORD}"
        - name: LITELLM_MASTER_KEY
          value: "${LITELLM_MASTER_KEY}"
        # RULE 4: Trace and Log Exporter Credentials
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
        - name: LANGFUSE_PUBLIC_KEY
          value: "${LANGFUSE_PUBLIC_KEY}"
        - name: LANGFUSE_SECRET_KEY
          value: "${LANGFUSE_SECRET_KEY}"
        - name: LANGFUSE_HOST
          value: "${LANGFUSE_HOST}"
        volumeMounts:
        - name: config-volume
          mountPath: /app/config.yaml
          subPath: config.yaml
        ports:
        - containerPort: 4000
        # RULE 3: LiteLLM Health & Readiness Probes
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 4000
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: config-volume
        configMap:
          name: litellm-config
