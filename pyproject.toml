[project]
name = "vllm-deployment-orchestrator"
version = "0.1.0"
description = "vLLM Multi-Model Deployment Engine"
readme = "README.md"
requires-python = ">=3.10"

# Core application dependencies managed by `uv add`
dependencies = [
    "jinja2>=3.1.2",
    "python-dotenv>=1.0.0",
]

# Development dependencies (testing, linting)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "ruff>=0.9.0",
]


# Devel
[tool.ruff]
# Target Python version compatibility
target-version = "py310"
# Maximum line length
line-length = 100

# Files or directories to exclude
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Select rules to enforce:
# E: pycodestyle errors
# F: Pyflakes
# I: isort (import sorting)
# B: flake8-bugbear
# UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]

# Rules to ignore (if any)
ignore = []

# Allow fix for all enabled rules (when `--fix` is passed)
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# Combine multiple imports from the same package into one line
combine-as-imports = true

[tool.ruff.format]
# Prefer double quotes over single quotes
quote-style = "double"

# Use spaces instead of tabs for indentation
indent-style = "space"

# Respect line length limit during formatting
line-ending = "auto"
